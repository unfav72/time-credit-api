<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="TimeCredit Live: Skill-exchange and live-learning platform powered by a relational DBMS, double-entry accounting, in-built video classrooms, and Razorpay top-ups." />
    <title>TimeCredit Live — Skill Exchange & Live Learning</title>

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- Razorpay Standard Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Jitsi Meet External API (supported fallback) -->
    <script src="https://meet.jit.si/external_api.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Auto-recovery from stale cache / chunk mismatch errors (prevents blank screen)
      window.addEventListener('error', function (e) {
        var msg = (e && e.message ? e.message : '').toLowerCase();
        if (msg.includes('unexpected token') || msg.includes('loading chunk') || msg.includes('dynamically imported module') || msg.includes('failed to fetch')) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            });
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
          }
          if (!sessionStorage.getItem('tc_chunk_recovered')) {
            sessionStorage.setItem('tc_chunk_recovered', '1');
            window.location.reload();
          }
        }
      });
      window.addEventListener('load', function () {
        sessionStorage.removeItem('tc_chunk_recovered');
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register PWA Service Worker with auto-update
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              reg.update();
              console.log('PWA ServiceWorker registered:', reg.scope);
            })
            .catch(err => console.warn('PWA ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
